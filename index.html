<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interaction Archive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anta&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="./p5.min.js"></script>
  <script src="sketch.js"></script>
  <script src="script.js" defer></script>
</head>
<body>
  <main class="archive-screen" aria-labelledby="archive-title">
    <section class="archive-panel" aria-label="Interactive design archive">
      <button class="archive-home" id="archive-title" type="button" aria-label="Archive home">
        Archive
      </button>

      <ol class="project-list">
        <li>
          <button
            class="project-link"
            type="button"
            data-project="counterweight"
            aria-controls="project-view"
            aria-expanded="false"
          >
            <span class="project-number" aria-hidden="true">01</span>
            <span>Counterweight</span>
          </button>
        </li>
        <li>
          <button
            class="project-link"
            type="button"
            data-project="melting-ice"
            aria-controls="project-view"
            aria-expanded="false"
          >
            <span class="project-number" aria-hidden="true">02</span>
            <span>Meting Ice</span>
          </button>
        </li>
      </ol>

      <p class="archive-category">INTERACTIVE DESIGN (2)</p>

      <span class="archive-divider" aria-hidden="true">
        <img src="assets/archive-divider.svg" alt="" width="1111" height="1">
      </span>
    </section>

    <section class="archive-stage" id="project-view" aria-label="Interactive project" aria-live="polite">
      <button class="detail-back" type="button" hidden>← Back</button>
      <iframe
        class="project-frame"
        title="Interactive project"
        loading="eager"
        hidden
      ></iframe>
    </section>
  </main>
</body>
</html>
