<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interaction Archive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anta&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="./p5.min.js"></script>
  <script src="sketch.js"></script>
  <script src="script.js" defer></script>
</head>
<body>
  <main class="archive-screen" aria-labelledby="archive-title">
    <section class="archive-panel" aria-label="Interactive design archive">
      <h1 id="archive-title">Archive</h1>

      <ol class="project-list">
        <li>
          <button
            class="project-link"
            type="button"
            aria-controls="counterweight-view"
            aria-expanded="false"
          >
            <span class="project-number" aria-hidden="true">1.</span>
            <span>Counterweight</span>
          </button>
        </li>
      </ol>

      <p class="archive-category">INTERACTIVE DESIGN (2)</p>

      <span class="archive-divider" aria-hidden="true">
        <img src="assets/archive-divider.svg" alt="" width="1111" height="1">
      </span>
    </section>

    <section class="archive-stage" id="counterweight-view" aria-label="Counterweight project" aria-live="polite">
      <iframe
        class="project-frame"
        title="Counterweight interactive project"
        data-local-src="../%EC%86%8C%EA%B3%BC%EC%A0%9C%20Dynamic%20Balance/index.html"
        data-src="./counterweight.html"
        loading="eager"
        hidden
      ></iframe>
    </section>
  </main>
</body>
</html>
